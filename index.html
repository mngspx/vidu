<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            max-width: 1200px;
            background-color: green;
            display: flex;  flex-direction: row;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .item{ width: 100%;  padding: 10px 0px ; text-align: center}
        .k1{ background-color: yellow}
        .k2{ background-color: cyan}
        .k3{ background-color: pink}
        @media screen and (min-width:600px) {
            .container{
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>
    <h1>Demo flex</h1>
    <div class="container">
        <div class="item k1">Khối 111</div>
        <div class="item k2">Khối 222</div>
        <div class="item k3">Khối 333</div>
    </div> 
</body>
</html>
